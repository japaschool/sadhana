    <title>Sadhana Pro</title>
    <!-- /#reset recovers a broken install: drop the workers, caches and saved query cache, then reload.
         sadhana-outbox stays on purpose: it holds diary values the server doesn't have yet. -->
    <script>
      if (location.hash === '#reset') {
        (async () => {
          try {
            for (const r of (await navigator.serviceWorker?.getRegistrations()) ?? []) await r.unregister()
            for (const k of await caches.keys()) await caches.delete(k)
            await new Promise((done) => {
              const d = indexedDB.deleteDatabase('sadhana-query')
              d.onsuccess = d.onerror = d.onblocked = done
            })
          } finally {
            location.replace(location.pathname)
          }
        })()
      }
    </script>
    <!-- Shown until React mounts over it; mirrors UiLoading (src/layouts/ByLayout.tsx). -->
    <style>
      .boot { display: flex; min-height: 100dvh; align-items: center; justify-content: center; background: #F7F4EE; }
      .boot span { width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid #E7E1D6; border-top-color: #9A6410; animation: boot-spin 1s linear infinite; }
      @media (prefers-color-scheme: dark) {
        .boot { background: #15121D; }
        .boot span { border-color: #332E40; border-top-color: #F0B54A; }
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
