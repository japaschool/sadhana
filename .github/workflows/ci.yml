name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-react
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sadhana_pro
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sadhana_pro
      JWT_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91.1 # keep in step with the Dockerfile
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply migrations
        run: for f in migrations/*/up.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test -- --test-threads=1
